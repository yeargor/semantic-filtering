services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 22181:2181

  kafka-server:
    image: confluentinc/cp-kafka:latest
    restart: on-failure
    container_name: kafka-server
    depends_on:
      - zookeeper
    ports:
      - 29092:29092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-server:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka-server
      - zookeeper
    ports:
      - 8090:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-server:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  my-postgres:
    image: quay.io/debezium/example-postgres
    container_name: recipe-postgres-db
    restart: on-failure
    volumes:
      - ./bootstrap/psql/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pleasecomein
    command: [ "postgres", "-c", "wal_level=logical" ]
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 5s
      retries: 10

  debezium-postgres-connect:
    image: debezium/connect:3.0.0.Final
    container_name: debezium-postgres-connect
    ports:
      - 8087:8083
    environment:
      CONFIG_STORAGE_TOPIC: postgres_connect_configs
      OFFSET_STORAGE_TOPIC: postgres_connect_offsets
      STATUS_STORAGE_TOPIC: postgres_connect_statuses
      BOOTSTRAP_SERVERS: kafka-server:9092
      KAFKA_CONNECT_PLUGINS_DIR: /kafka/connect/
    depends_on:
      - kafka-server
      - zookeeper
      - my-postgres

  my-chroma:
    image: chromadb/chroma:1.0.14.dev40
    container_name: chroma-db
    restart: on-failure
    ports:
      - "8000:8000"